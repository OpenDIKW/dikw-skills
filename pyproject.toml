[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dikw-skills"
version = "0.2.6"
description = "Agent skills and plugin packaging for dikw client workflows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "holo", email = "helebest@gmail.com" }]
keywords = ["dikw", "agent-skills", "codex", "claude", "openclaw", "hermes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
dikw-skills-validate = "dikw_skills.cli:validate_main"
dikw-skills-sync-plugin = "dikw_skills.cli:sync_plugin_main"
dikw-skills-build = "dikw_skills.cli:build_main"

[tool.hatch.build.targets.wheel]
packages = ["src/dikw_skills"]
