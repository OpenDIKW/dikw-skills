name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  baseline:
    name: Quality baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project
        run: uv sync --frozen

      - name: Validate skills
        run: uv run dikw-skills-validate

      - name: Check plugin sync is up to date
        run: uv run dikw-skills-sync-plugin --check

      - name: Run tests
        run: uv run python -m unittest discover -s tests

      - name: Build release artifacts
        run: uv run dikw-skills-build
