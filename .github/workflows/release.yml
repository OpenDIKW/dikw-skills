name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # required to create GitHub Releases

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project
        run: uv sync --frozen

      - name: Verify tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(uv run python -c "import tomllib,sys; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${pkg}" >&2
            exit 1
          fi

      - name: Validate skills
        run: uv run dikw-skills-validate

      - name: Check plugin sync is up to date
        run: uv run dikw-skills-sync-plugin --check

      - name: Run tests
        run: uv run python -m unittest discover -s tests

      - name: Build skill and plugin artifacts
        run: uv run dikw-skills-build

      - name: Build Python distributions
        run: uv build --out-dir dist/python

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/skills/*.zip
            dist/plugins/*.zip
            dist/checksums.txt
            dist/python/*
